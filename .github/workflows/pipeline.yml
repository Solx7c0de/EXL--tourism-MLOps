name: Tourism Project MLOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tourism-mlops:
    name: Tourism MLOps Pipeline
    runs-on: ubuntu-latest

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Deployment/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Deployment/requirements.txt

      - name: Register Dataset on Hugging Face
        if: github.event_name != 'pull_request'
        run: python src/register_data.py

      - name: Prepare Data
        run: python src/data_prep.py

      - name: Train Models and Track Experiments
        run: python src/train_model.py

      - name: Validate Saved Model
        run: |
          python -c "import joblib; model = joblib.load('models/best_model.pkl'); print('Model loaded:', type(model).__name__)"

      - name: Validate Streamlit App Syntax
        run: python -m py_compile Deployment/app.py

      - name: Upload Pipeline Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tourism-mlops-results
          path: |
            model_comparison.csv
            models/best_model.pkl
            models/best_metrics.json
            mlruns/
          if-no-files-found: warn
          retention-days: 30
